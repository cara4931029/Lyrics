<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>歌詞填空遊戲</title>
    <style>
        :root {
            --bg-color: #121212; --container-bg: #1e1e1e;
            --primary-color: #bb86fc; --secondary-color: #03dac6;
            --error-color: #ff5252; --text-color: #e0e0e0;
            --sub-text: #888; --border-color: #333; --input-bg: #2c2c2c;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; display: flex; justify-content: center; min-height: 100vh;
        }
        .container { width: 100%; max-width: 800px; padding: 15px; display: flex; flex-direction: column; }
        .stats-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px; font-size: 0.85rem; flex-wrap: wrap; gap: 8px;
        }
        .stats-summary b { color: var(--primary-color); margin: 0 3px; }
        .nav-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .nav-btns button {
            background: none; border: 1px solid var(--primary-color);
            color: var(--primary-color); padding: 5px 10px; border-radius: 5px;
            cursor: pointer; font-size: 0.8rem;
        }
        #nav-btn-game { background: var(--primary-color); color: #000; font-weight: bold; border: none; }
        .view { display: none; flex-direction: column; }
        .view.active { display: flex; }
        .mode-selector {
            background: var(--container-bg); padding: 30px 20px; border-radius: 15px;
            text-align: center; margin-bottom: 20px; border: 1px solid #333;
        }
        .lyrics-box {
            background: var(--container-bg); padding: 25px; border-radius: 15px;
            line-height: 2.6; font-size: 1.3rem; text-align: center;
            margin-bottom: 15px; min-height: 220px;
        }
        .lyric-line { display: block; margin-bottom: 8px; word-wrap: break-word; }
        .blank-group { display: inline-flex; flex-wrap: nowrap; white-space: nowrap; vertical-align: bottom; margin: 0 1px; }
        .char-unit {
            display: inline-block; width: 1.1rem; border-bottom: 2.5px solid var(--primary-color);
            margin-right: 2.5px; text-align: center; height: 1.7rem; line-height: 1.5rem;
            font-family: monospace; font-weight: bold; transition: 0.2s;
        }
        .fill-correct { color: var(--secondary-color); border-bottom-color: var(--secondary-color); }
        .fill-wrong { color: var(--error-color); border-bottom-color: var(--error-color); }
        .fill-hint { color: var(--primary-color); }
        .main-textarea {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border-color);
            color: #fff; padding: 15px; font-size: 1.2rem; border-radius: 12px; outline: none;
            resize: none; overflow-y: hidden; min-height: 85px; line-height: 1.4; font-family: inherit;
        }
        .action-row { display: flex; gap: 8px; margin-top: 10px; }
        button.btn { border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button.btn:active { opacity: 0.6; }
        .btn-aux { flex: 1; padding: 12px 0; font-size: 0.9rem; background: #333; color: #bbb; }
        .btn-main { flex: 2.5; padding: 15px 0; font-size: 1.2rem; background: var(--primary-color); color: #000; }
        .btn-small { padding: 5px 10px; font-size: 0.8rem; background: #444; color: #fff; }
        .search-bar { width: 100%; padding: 12px; margin-bottom: 15px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; }
        .list-item {
            background: var(--container-bg); padding: 15px; margin-bottom: 10px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #222;
        }
        .list-item-compact {
            background: var(--container-bg); padding: 8px 12px; margin-bottom: 6px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #222;
            font-size: 0.9rem;
        }
        .item-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95);
            z-index: 1000; display: none; padding: 20px; overflow-y: auto;
        }
        .modal-body { background: var(--container-bg); max-width: 600px; margin: 20px auto; border-radius: 15px; padding: 25px; }
        .modal-body label { display: block; margin: 15px 0 5px; color: var(--primary-color); font-weight: bold; }
        .lyrics-textarea-large {
            width: 100%; background: var(--input-bg); color: #fff; padding: 12px; border-radius: 8px; 
            border: 1px solid #444; font-size: 1rem; line-height: 1.6; min-height: 350px; font-family: inherit;
        }
        .multi-select-list { max-height: 420px; overflow-y: auto; margin: 12px 0; border: 1px solid #333; border-radius: 8px; }
        .multi-select-item { display: flex; align-items: center; padding: 8px 12px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.9rem; }
        .multi-select-item input { margin-right: 12px; width: 18px; height: 18px; cursor: pointer; }
        .pagination-bar {
            display: flex; justify-content: center; align-items: center; gap: 6px; margin: 12px 0; font-size: 0.85rem; flex-wrap: wrap;
        }
        .page-select {
            background: #2c2c2c; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 3px 6px; font-size: 0.85rem; outline: none; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="stats-header">
        <div class="stats-summary">對:<b><span id="st-ok">0</span></b> 字:<b><span id="st-ch">0</span></b> 跳過:<b><span id="st-sk">0</span></b></div>
        <div class="nav-btns">
            <button id="nav-btn-game" style="display:none" onclick="App.switchView('game')">回遊戲</button>
            <button onclick="App.switchView('playlists')">歌單管理</button>
            <button onclick="App.switchView('editor')">題庫管理</button>
            <button onclick="Tolerance.openModal()">容錯設定</button>

    </div>

    <div id="view-game" class="view active">

                <span style="font-size:0.8rem">
                    <a href="javascript:void(0)" onclick="Data.loadQuestionJson(true)" style="color:var(--secondary-color);text-decoration:none;margin-right:12px">🔄 重新載入題庫</a>
                    <a href="javascript:void(0)" onclick="Logic.toggleAllRanges(true)" style="color:var(--primary-color);text-decoration:none;margin-right:10px">全選</a>
                    <a href="javascript:void(0)" onclick="Logic.toggleAllRanges(false)" style="color:#888;text-decoration:none">清空</a>
                </span>
            </div>
            <div id="play-range-list" class="multi-select-list" style="text-align:left;max-height:220px;margin-bottom:20px"></div>
            <button class="btn btn-main" style="width:100%" onclick="Logic.startGame()">開始挑戰</button>
        </div>

            <div id="game-lyrics-view" class="lyrics-box"></div>
            
            <textarea id="player-input" class="main-textarea" rows="2"

                <button class="btn btn-main" onclick="Logic.submit()">確定送出</button>

        </div>
    </div>

    <div id="view-editor" class="view">
        <div class="action-row" style="margin-bottom:15px">
            <button class="btn btn-main" onclick="Editor.openModal()">+ 新增歌曲</button>
            <button class="btn btn-aux" onclick="Data.loadQuestionJson(true)">載入 question.json</button>
            <button class="btn btn-aux" onclick="Data.exportAll()">匯出</button>
            <button class="btn btn-aux" onclick="document.getElementById('import-file').click()">匯入</button>
        </div>
        <input type="text" id="search-input" class="search-bar" placeholder="搜尋題庫..." oninput="Editor.onSearchInput()">
        <div style="display:flex;justify-content:space-between;align-items:center;margin:-5px 0 15px 5px;font-size:0.85rem;color:#aaa">
            <label style="cursor:pointer;display:inline-flex;align-items:center;gap:6px">
                <input type="checkbox" id="search-advanced" onchange="Editor.onSearchInput()">

            </label>

            <span style="font-size:0.8rem">
                <a href="javascript:void(0)" onclick="Editor.toggleSelectAll(true)" style="color:var(--primary-color);text-decoration:none;margin-right:10px">全選</a>
                <a href="javascript:void(0)" onclick="Editor.toggleSelectAll(false)" style="color:#888;text-decoration:none;margin-right:12px">清除</a>
                <button class="btn btn-aux btn-small" id="editor-batch-fav-btn" style="color:var(--primary-color);padding:3px 8px;border:1px solid #555;margin-right:6px" onclick="Editor.openBatchFav()">批量加入歌單</button>
                <button class="btn btn-aux btn-small" id="editor-batch-del-btn" style="color:var(--error-color);padding:3px 8px;border:1px solid #555" onclick="Editor.deleteBatch()">批量刪除</button>
            </span>

    <div id="view-playlists" class="view">
        <h3 style="margin-top:0;margin-bottom:12px">管理歌單</h3>
        <div class="action-row" style="margin-top:0;margin-bottom:12px">
            <input type="text" id="new-pl-name" class="search-bar" style="flex:2;margin-bottom:0" placeholder="歌單名稱...">
            <button class="btn btn-main" style="flex:1" onclick="Playlists.create()">建立</button>

<div id="song-modal" class="modal">

        <input type="hidden" id="edit-id">

        <input type="text" id="edit-title" class="search-bar">
        <label>歌手</label>
        <input type="text" id="edit-artist" class="search-bar">
        <label>語言</label>

            <label style="margin:0;color:var(--primary-color);font-weight:bold">歌詞</label>

        <div class="action-row">
            <button class="btn btn-main" onclick="Editor.save()">儲存</button>

<div id="tolerance-modal" class="modal">

            </div>
            <div id="import-tol-conflict-box" style="background:#222;border:1px solid #444;border-radius:8px;padding:12px;display:none;font-size:0.85rem">
                <div style="color:var(--primary-color);font-weight:bold;margin-bottom:6px">⚠️ 偵測到容錯設定不同：</div>
                <div style="color:#aaa;margin-bottom:8px">若容錯設定有衝突時：</div>
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:6px">
                    <input type="radio" name="tol-conflict-pref" value="cloud" checked>
                    <span>保留現有版本（忽略本地檔案容錯設定）</span>
                </label>
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                    <input type="radio" name="tol-conflict-pref" value="local">

<div id="fav-modal" class="modal"><div class="modal-body"><h3>加入歌單</h3><input type="hidden" id="fav-song-id"><div id="fav-playlist-options"></div><button class="btn btn-aux" style="width:100%;margin-top:10px" onclick="document.getElementById('fav-modal').style.display='none'">關閉</button></div></div>

        <div id="batch-fav-options" style="max-height:360px;overflow-y:auto;margin:12px 0"></div>
        <div class="action-row" style="margin-top:10px">

<div id="multi-fav-modal" class="modal">
    <div class="modal-body">
        <h3 style="margin-top:0">編輯歌單歌曲</h3>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="font-size:0.85rem;color:#888" id="multi-pl-name"></span>

        <input type="text" id="multi-pl-search" class="search-bar" placeholder="搜尋歌曲 (歌名或歌手)..." style="margin-bottom:8px" oninput="Playlists.onSearchInput()">

        <div class="action-row">
            <button class="btn btn-main" onclick="Playlists.saveMultiAdd()">儲存變更</button>
            <button class="btn btn-aux" onclick="document.getElementById('multi-fav-modal').style.display='none'">取消</button>
        </div>
    </div>
</div>

<script>
// 取消預設題庫，初始為空陣列
const INITIAL_SONGS = [];

// 容錯預設值：僅保留 你/妳、他/她、喔/哦/噢
const DEFAULT_TOLERANCE = "你/妳\n他/她\n喔/哦/噢";

const Tolerance = {
    map: null,
    getRaw: () => {
        const val = localStorage.getItem('ly_v17_tol');
        if (val === null || val === "你/妳\n哦/喔/噢\n做/作\n只/隻\n他/她/牠") {
            return DEFAULT_TOLERANCE;
        }
        return val;
    },
    setRaw: (v) => localStorage.setItem('ly_v17_tol', v),
    init: () => {
        Tolerance.build(Tolerance.getRaw());
    },
    build: (rawStr) => {
        const lines = (rawStr || "").split('\n').map(l => l.trim()).filter(Boolean);
        const charMap = new Map();
        const phraseMap = [];
        const phraseRules = [];

        lines.forEach(line => {
            const parts = line.split(/[/,，、|\s]+/).map(p => p.trim()).filter(Boolean);
            if (parts.length > 1) {
                const canonical = parts[0].normalize('NFKC').toLowerCase();
                const isAllSingleChar = parts.every(p => p.normalize('NFKC').toLowerCase().length === 1);
                if (isAllSingleChar) {
                    parts.forEach(p => {
                        const norm = p.normalize('NFKC').toLowerCase();
                        if (norm !== canonical) {
                            charMap.set(norm, canonical);
                        }
                    });
                } else {
                    const variants = [];
                    parts.forEach(p => {
                        const norm = p.normalize('NFKC').toLowerCase();
                        if (!variants.includes(norm)) variants.push(norm);
                        if (norm !== canonical) {
                            phraseMap.push({ from: norm, to: canonical });
                        }
                    });
                    phraseRules.push({ canonical, variants });
                }
            }
        });

        // 依詞組長度由長至短排序，避免短詞先行截斷長詞
        phraseMap.sort((a, b) => b.from.length - a.from.length);
        phraseRules.sort((a, b) => b.canonical.length - a.canonical.length);
        Tolerance.map = { charMap, phraseMap, phraseRules };
    },
    normalize: (str) => {
        if (!str) return "";
        if (!Tolerance.map) Tolerance.init();
        let s = str.normalize('NFKC').toLowerCase().replace(/\s/g, '');
        for (const { from, to } of Tolerance.map.phraseMap) {
            s = s.replaceAll(from, to);
        }
        let res = "";
        for (const ch of s) {
            res += Tolerance.map.charMap.get(ch) || ch;
        }
        return res;
    },
    isEqual: (c1, c2) => {
        if (!c1 || !c2) return false;
        if (!Tolerance.map) Tolerance.init();
        const n1 = c1.normalize('NFKC').toLowerCase();
        const n2 = c2.normalize('NFKC').toLowerCase();
        if (n1 === n2) return true;
        const can1 = Tolerance.map.charMap.get(n1) || n1;
        const can2 = Tolerance.map.charMap.get(n2) || n2;
        return can1 === can2;
    },
    getMatchMask: (userIn, targetStr) => {
        if (!userIn || !targetStr) return [];
        if (!Tolerance.map) Tolerance.init();
        const uChars = typeof userIn === 'string' ? userIn.replace(/\s/g, '').split('') : userIn;
        const tChars = targetStr.replace(/\s/g, '').split('');
        const len = tChars.length;
        const mask = new Array(len).fill(false);

        // 1. 單字比對（含單字容錯 charMap）
        for (let i = 0; i < len && i < uChars.length; i++) {
            if (Tolerance.isEqual(uChars[i], tChars[i])) {
                mask[i] = true;
            }
        }

        // 2. 詞組上下文比對（僅在設定的詞組完整吻合時互通，不影響其他詞彙）
        if (Tolerance.map.phraseRules && Tolerance.map.phraseRules.length > 0) {
            const uStr = uChars.join('');
            const tStr = tChars.join('');
            for (const rule of Tolerance.map.phraseRules) {
                const vLens = [...new Set(rule.variants.map(v => v.length))];
                for (const vLen of vLens) {
                    for (let i = 0; i <= len - vLen && i <= uStr.length - vLen; i++) {
                        const tSub = tStr.slice(i, i + vLen);
                        const uSub = uStr.slice(i, i + vLen);
                        if (Tolerance.normalize(tSub) === rule.canonical && Tolerance.normalize(uSub) === rule.canonical) {
                            for (let k = 0; k < vLen; k++) {
                                mask[i + k] = true;
                            }
                        }
                    }
                }
            }
        }

        return mask;
    },
    openModal: () => {
        document.getElementById('tolerance-textarea').value = Tolerance.getRaw();
        document.getElementById('tolerance-modal').style.display = 'block';
    },
    closeModal: () => {
        document.getElementById('tolerance-modal').style.display = 'none';
    },
    resetDefaults: () => {
        document.getElementById('tolerance-textarea').value = DEFAULT_TOLERANCE;
    },
    save: () => {
        const val = document.getElementById('tolerance-textarea').value;
        Tolerance.setRaw(val);
        Tolerance.build(val);
        Tolerance.closeModal();
        if (Logic.state.song) App.render(false);
        alert("容錯設定已儲存！");
    }
};

const Parser = {
    clean: (t) => t.replace(/[\(\[\{（【「『][^\)\]\}）】」』]*[\)\]\}）】」』]/g, '').trim(),
    tokenize: (line) => {
        const tokens = [];
        let i = 0;
        while (i < line.length) {
            const ch = line[i];
            if (/[a-zA-Z0-9]/.test(ch)) {
                let w = "";
                while (i < line.length && /[a-zA-Z0-9]/.test(line[i])) { w += line[i]; i++; }
                tokens.push({ type: 'en', val: w });
            } else if (/\s/.test(ch)) {
                tokens.push({ type: 'sp', val: ch });
                i++;
            } else if (/[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/.test(ch)) {
                tokens.push({ type: 'cjk', val: ch });
                i++;
            } else {
                tokens.push({ type: 'sym', val: ch });
                i++;
            }
        }
        return tokens;
    }
};

const Data = {
    pendingImport: null,
    getSongs: () => JSON.parse(localStorage.getItem('ly_v17_s')) || INITIAL_SONGS,
    saveSongs: (s) => localStorage.setItem('ly_v17_s', JSON.stringify(s)),
    getPlaylists: () => {
        let p = JSON.parse(localStorage.getItem('ly_v17_p')) || [];
        p = Data.ensureLangPlaylists(p);
        const isLang = (x) => x && ((x.id && x.id.startsWith('pl_lang_')) || ['中文', '英文', '日文'].includes(x.name));
        const langPls = p.filter(isLang);
        const customPls = p.filter(x => !isLang(x));
        return [...langPls, ...customPls];
    },
    savePlaylists: (p) => localStorage.setItem('ly_v17_p', JSON.stringify(p)),
    ensureLangPlaylists: (pls) => {
        let changed = false;
        const langDefs = [
            { id: 'pl_lang_zh', name: '中文' },
            { id: 'pl_lang_en', name: '英文' },
            { id: 'pl_lang_ja', name: '日文' }
        ];
        langDefs.forEach(def => {
            let found = pls.find(x => x.id === def.id || x.name === def.name);
            if (!found) {
                pls.push({ id: def.id, name: def.name, songIds: [] });
                changed = true;
            } else if (!found.id.startsWith('pl_lang_')) {
                found.id = def.id;
                changed = true;
            }
        });
        if (changed) Data.savePlaylists(pls);
        return pls;
    },
    syncSongWithLangPlaylists: (songId, lang) => {
        const pls = Data.getPlaylists();
        let changed = false;
        const langMap = { 'zh': 'pl_lang_zh', 'en': 'pl_lang_en', 'ja': 'pl_lang_ja' };
        ['zh', 'en', 'ja'].forEach(k => {
            const targetId = langMap[k];
            const p = pls.find(x => x.id === targetId);
            if (p) {
                if (k === lang) {
                    if (!p.songIds.includes(songId)) {
                        p.songIds.push(songId);
                        changed = true;
                    }
                } else {
                    if (p.songIds.includes(songId)) {
                        p.songIds = p.songIds.filter(id => id !== songId);
                        changed = true;
                    }
                }
            }
        });
        if (changed) Data.savePlaylists(pls);
    },
    syncLangPlaylistsWithSongs: (playlistId, newSongIds, oldSongIds) => {
        let targetLang = null;
        if (playlistId === 'pl_lang_zh') targetLang = 'zh';
        else if (playlistId === 'pl_lang_en') targetLang = 'en';
        else if (playlistId === 'pl_lang_ja') targetLang = 'ja';
        else {
            const p = Data.getPlaylists().find(x => x.id === playlistId);
            if (p) {
                if (p.name === '中文') targetLang = 'zh';
                else if (p.name === '英文') targetLang = 'en';
                else if (p.name === '日文') targetLang = 'ja';
            }
        }
        if (!targetLang) return;

        const songs = Data.getSongs();
        let songsChanged = false;
        const addedIds = newSongIds.filter(id => !oldSongIds.includes(id));
        const removedIds = oldSongIds.filter(id => !newSongIds.includes(id));

        addedIds.forEach(id => {
            const s = songs.find(x => x.id === id);
            if (s) {
                s.lang = targetLang;
                songsChanged = true;
            }
        });

        removedIds.forEach(id => {
            const s = songs.find(x => x.id === id);
            if (s) {
                s.lang = "";
                songsChanged = true;
            }
        });

        if (songsChanged) {
            Data.saveSongs(songs);
            if (addedIds.length > 0) {
                const pls = Data.getPlaylists();
                let plsChanged = false;
                const otherLangKeys = ['pl_lang_zh', 'pl_lang_en', 'pl_lang_ja'].filter(k => k !== playlistId);
                otherLangKeys.forEach(otherId => {
                    const op = pls.find(x => x.id === otherId);
                    if (op && op.songIds) {
                        const beforeLen = op.songIds.length;
                        op.songIds = op.songIds.filter(id => !addedIds.includes(id));
                        if (op.songIds.length !== beforeLen) plsChanged = true;
                    }
                });
                if (plsChanged) Data.savePlaylists(pls);
            }
        }
    },
    getStats: () => JSON.parse(localStorage.getItem('ly_v17_st')) || { ok:0, ch:0, sk:0, hist:[], playedInRound:[], usedMap:{} },
    saveStats: (s) => localStorage.setItem('ly_v17_st', JSON.stringify(s)),
    exportAll: () => {
        const d = {s:Data.getSongs(), p:Data.getPlaylists(), st:Data.getStats(), tol:Tolerance.getRaw()};
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(d)], {type: "application/json"}));
        a.download = `lyrics_backup_${Date.now()}.json`; a.click();
    },
    importJSON: (i) => {

        r.onload = (e) => {
            try {
                const d = JSON.parse(e.target.result);

                }

                // 若現有題庫已有內容，開啟彈窗供選擇合併或覆蓋

            } finally {
                i.value = "";
            }
        };
        if(i.files[0]) r.readAsText(i.files[0]);
    },

    openImportModal: (exSongs, impSongs, impPls) => {
        const exPls = Data.getPlaylists();
        const isLang = (x) => x && ((x.id && x.id.startsWith("pl_lang_")) || ["中文", "英文", "日文"].includes(x.name));
        
        const conflictingSongs = impSongs.filter(imp => 
            exSongs.some(ex => ex.title.trim().toLowerCase() === imp.title.trim().toLowerCase() && ex.artist.trim().toLowerCase() === imp.artist.trim().toLowerCase())
        );
        const conflictingPls = impPls.filter(imp => 
            !isLang(imp) && exPls.some(ex => !isLang(ex) && ex.name.trim().toLowerCase() === imp.name.trim().toLowerCase())
        );

        const conflictBox = document.getElementById('import-conflict-box');
        const conflictMsg = document.getElementById('import-conflict-msg');
        const conflictCount = conflictingSongs.length + conflictingPls.length;

        if (conflictCount > 0) {
            let msg = `⚠️ 偵測到衝突項目：`;
            if (conflictingSongs.length > 0) msg += `重複歌曲 ${conflictingSongs.length} 首 `;
            if (conflictingPls.length > 0) msg += `重複歌單 ${conflictingPls.length} 個`;
            conflictMsg.innerText = msg;
            conflictBox.style.display = 'block';
        } else {
            conflictBox.style.display = 'none';
        }

        const tolBox = document.getElementById('import-tol-conflict-box');
        const d = Data.pendingImport ? Data.pendingImport.d : null;
        const hasTolDiff = d && d.tol !== undefined && d.tol.trim() !== Tolerance.getRaw().trim();
        if (tolBox) {
            tolBox.style.display = hasTolDiff ? 'block' : 'none';
        }

        document.getElementById('import-modal').style.display = 'block';
    },

    cancelImport: () => {
        Data.pendingImport = null;
        document.getElementById('import-modal').style.display = 'none';
    },

    executeImport: (mode) => {
        if (!Data.pendingImport) return;
        const { d, songs, playlists } = Data.pendingImport;
        const conflictPref = document.querySelector('input[name="conflict-pref"]:checked')?.value || 'cloud';
        const tolPref = document.querySelector('input[name="tol-conflict-pref"]:checked')?.value || 'cloud';

        if (mode === 'replace') {
            Data.applyImportData(songs, playlists, d, 'replace', conflictPref, tolPref);
            alert(`已完全以本地檔案取代！共載入 ${songs.length} 首歌。`);
        } else {
            const result = Data.applyImportData(songs, playlists, d, 'merge', conflictPref, tolPref);
            alert(`增量合併完成！新增 ${result.addedCount} 首歌曲${result.updatedCount > 0 ? `，更新 ${result.updatedCount} 首重複歌曲` : ''}。`);
        }

        Data.cancelImport();
        location.reload();
    },

    applyImportData: (impSongs, impPls, d, mode, conflictPref = 'cloud', tolPref = 'cloud') => {
        const hasTolDiff = d && d.tol !== undefined && d.tol.trim() !== Tolerance.getRaw().trim();
        if (mode === 'replace') {
            Data.saveSongs(impSongs);
            if (impPls && impPls.length > 0) Data.savePlaylists(impPls);
            if (d && d.st) Data.saveStats(d.st);
            if (d && d.tol !== undefined) {
                if (!hasTolDiff || tolPref === 'local') {
                    Tolerance.setRaw(d.tol);
                    Tolerance.build(d.tol);
                }
            }
            localStorage.removeItem('ly_v17_ag');
            return { addedCount: impSongs.length, updatedCount: 0 };
        }

        // 增量合併邏輯
        const exSongs = Data.getSongs();
        const exPls = Data.getPlaylists();
        const { finalSongs, finalPls, addedCount, updatedCount } = Data.mergeData(exSongs, exPls, impSongs, impPls, conflictPref);

        Data.saveSongs(finalSongs);
        Data.savePlaylists(finalPls);
        Data.ensureLangPlaylists(finalPls);
        finalSongs.forEach(s => { if (s.lang) Data.syncSongWithLangPlaylists(s.id, s.lang); });

        if (d && d.tol !== undefined) {
            if (tolPref === 'local') {
                Tolerance.setRaw(d.tol);
                Tolerance.build(d.tol);
            }
        }
        localStorage.removeItem('ly_v17_ag');
        return { addedCount, updatedCount };
    },

    mergeData: (exSongs, exPls, impSongs, impPls, conflictPref) => {
        const finalSongs = [...exSongs];
        const existingIds = new Set(finalSongs.map(s => s.id));
        const idMap = new Map();

        let addedCount = 0;
        let updatedCount = 0;

        impSongs.forEach((imp, idx) => {
            const exIndex = finalSongs.findIndex(s => 
                s.title.trim().toLowerCase() === imp.title.trim().toLowerCase() &&
                s.artist.trim().toLowerCase() === imp.artist.trim().toLowerCase()
            );

            if (exIndex === -1) {
                let newId = imp.id;
                if (!newId || existingIds.has(newId)) {
                    newId = "s_imp_" + Date.now() + "_" + idx;
                }
                existingIds.add(newId);
                idMap.set(imp.id, newId);
                finalSongs.push({ ...imp, id: newId });
                addedCount++;
            } else {
                const targetId = finalSongs[exIndex].id;
                idMap.set(imp.id, targetId);
                if (conflictPref === "local") {
                    finalSongs[exIndex] = { ...finalSongs[exIndex], id: targetId };
                    updatedCount++;
                }
            }
        });

        const isLang = (x) => x && ((x.id && x.id.startsWith("pl_lang_")) || ["中文", "英文", "日文"].includes(x.name));
        const finalPls = [...exPls];
        const finalSongIds = new Set(finalSongs.map(s => s.id));

        impPls.forEach((imp, idx) => {
            if (isLang(imp)) return;
            const remappedSongIds = (imp.songIds || [])
                .map(id => idMap.get(id) || id)
                .filter(id => finalSongIds.has(id));

            const exIndex = finalPls.findIndex(p => !isLang(p) && p.name.trim().toLowerCase() === imp.name.trim().toLowerCase());
            if (exIndex === -1) {
                let newPlId = imp.id;
                if (!newPlId || finalPls.some(p => p.id === newPlId)) {
                    newPlId = "pl_imp_" + Date.now() + "_" + idx;
                }
                finalPls.push({ ...imp, id: newPlId, songIds: remappedSongIds });
            } else {
                if (conflictPref === "local") {
                    finalPls[exIndex] = { ...finalPls[exIndex], songIds: remappedSongIds };
                }
            }
        });

        return { finalSongs, finalPls, addedCount, updatedCount };
    },

    // 容錯解析各種不同結構的題庫 JSON，完整保留空白換行段落
    parseRawData: (d) => {
        let rawSongs = [];
        let rawPlaylists = [];

        if (Array.isArray(d)) {
            rawSongs = d;
        } else if (d && typeof d === 'object') {
            if (Array.isArray(d.s)) rawSongs = d.s;
            else if (Array.isArray(d.songs)) rawSongs = d.songs;
            else if (Array.isArray(d.data)) rawSongs = d.data;

            if (Array.isArray(d.p)) rawPlaylists = d.p;
            else if (Array.isArray(d.playlists)) rawPlaylists = d.playlists;
        }

        const songs = rawSongs.map((s, idx) => {
            const id = s.id ? String(s.id) : ('s_' + (idx + 1));
            const title = String(s.title || s.name || s.song || s.songName || '無歌名').trim();
            const artist = String(s.artist || s.singer || s.author || '未知歌手').trim();
            const lang = s.lang || '';
            
            let lyrics = [];
            const rawL = s.lyrics || s.lyric || s.content || s.words;
            if (Array.isArray(rawL)) {
                lyrics = rawL.map(l => String(l));
            } else if (typeof rawL === 'string') {
                lyrics = rawL.split('\n');
            }

            return { id, title, artist, lang, lyrics };
        }).filter(s => s.title && s.lyrics.some(l => l.trim().length > 0));

        return { songs, playlists: rawPlaylists };
    },

    // 自動與手動載入 question.json
    loadQuestionJson: async (isManual = false) => {
        try {
            const res = await fetch('question.json?t=' + Date.now(), { cache: 'no-cache' });
            if (!res.ok) {
                if (isManual) alert(`載入失敗：找不到 question.json (HTTP 狀態碼: ${res.status})\n請確認 question.json 與本 html 放在同一資料夾，且檔名全為小寫。`);
                return false;
            }
            let text = await res.text();
            text = text.replace(/^\uFEFF/, '').trim();
            const lastHash = localStorage.getItem('ly_v17_bank_hash');
            const hasLocalSongs = !!localStorage.getItem('ly_v17_s');

            if (isManual || !hasLocalSongs || text !== lastHash) {
                const parsed = JSON.parse(text);
                const { songs, playlists } = Data.parseRawData(parsed);

                if (!songs || songs.length === 0) {
                    if (isManual) alert("載入失敗：question.json 內未偵測到任何歌曲！\n請檢查 JSON 格式是否包含歌名 (title) 與歌詞 (lyrics)。");
                    return false;
                }

                Data.saveSongs(songs);
                if (playlists && playlists.length > 0) {
                    Data.savePlaylists(playlists);
                }

                // 容錯設定檢查與選擇
                if (parsed.tol !== undefined) {
                    const cloudTol = String(parsed.tol).trim();
                    const localTol = Tolerance.getRaw().trim();
                    if (cloudTol && localTol && cloudTol !== localTol) {
                        const useCloud = confirm("【容錯設定不同提示】\n偵測到雲端檔案 (question.json) 的容錯設定與本地目前設定不同：\n\n【確定】：採用雲端檔案設定\n【取消】：保留本地目前設定");
                        if (useCloud) {
                            Tolerance.setRaw(parsed.tol);
                            Tolerance.build(parsed.tol);
                        }
                    } else {
                        Tolerance.setRaw(parsed.tol);
                        Tolerance.build(parsed.tol);
                    }
                }

                localStorage.setItem('ly_v17_bank_hash', text);
                localStorage.removeItem('ly_v17_ag');

                const st = Data.getStats();
                st.playedInRound = [];
                st.usedMap = {};
                Data.saveStats(st);

                Data.ensureLangPlaylists(Data.getPlaylists());
                songs.forEach(s => { if (s.lang) Data.syncSongWithLangPlaylists(s.id, s.lang); });
                
                // 載入新題庫時預設不選取任何範圍
                Logic.state.selectedRanges = [];
                Logic.refreshPlaylistSelect();

                if (document.getElementById('view-editor').classList.contains('active')) Editor.render();
                if (document.getElementById('view-playlists').classList.contains('active')) Playlists.render();

                if (isManual) {
                    alert(`🎉 成功載入題庫！共載入 ${songs.length} 首歌。`);
                }
                return true;
            }
        } catch (err) {
            console.warn("讀取 question.json 失敗：", err);
            if (isManual) {
                if (window.location.protocol === 'file:') {
                    alert("⚠️ 載入失敗：偵測到您目前是在電腦本機直接點兩下打開檔案 (file://)。\n\n瀏覽器安全政策會阻擋本機直接以程式碼讀取同資料夾檔案。\n\n【建議解決辦法】\n1. 上傳至 GitHub Pages 上玩（在 https:// 下可完全正常自動抓取）。\n2. 若要在電腦本機離線遊玩，可到「題庫管理」點擊【匯入】按鈕直接選取 question.json 即可！");
                } else {
                    alert(`載入失敗：${err.message || err}`);
                }
            }
        }
        return false;
    }
};

const App = {
    switchView: (v) => { 
        Logic.saveSession();
        document.querySelectorAll('.view').forEach(e=>e.classList.remove('active')); 
        document.getElementById(`view-${v}`).classList.add('active'); 
        
        const navBtnGame = document.getElementById('nav-btn-game');
        if(navBtnGame) {
            navBtnGame.style.display = (v === 'game') ? 'none' : 'inline-block';
        }
        
        if(v==='editor') Editor.render(); 
        if(v==='playlists') Playlists.render(); 
        if(v==='game') {
            const pa = document.getElementById('game-play-area');
            if (pa && pa.style.display !== 'none') {
                const inp = document.getElementById('player-input');
                if (inp) {
                    try {
                        const ag = JSON.parse(localStorage.getItem('ly_v17_ag'));
                        if (ag && ag.inputValue !== undefined) inp.value = ag.inputValue;
                    } catch(e){}
                    App.autoResize(inp);
                }
            }
        }
    },
    autoResize: (el) => { 
        el.style.height='auto'; 
        el.style.height=Math.max(85, Math.min(el.scrollHeight, window.innerHeight*0.35))+'px'; 
        Logic.saveSession();
    },
    render: (clearInput=true) => {
        document.getElementById('game-title').innerText = Logic.state.song.title;
        document.getElementById('game-artist').innerText = Logic.state.song.artist;
        document.getElementById('nav-btn-game').style.display = 'none';

        const gv = document.getElementById('game-lyrics-view'); gv.innerHTML = "";
        const curIn = Logic.state.lastRawInput ? Logic.state.lastRawInput.split('').filter(c => !/\s/.test(c)) : [];
        const matchMask = Tolerance.getMatchMask(curIn, Logic.state.target);
        let curInIdx = 0, charOffset = 0;

        Logic.state.tokensByLine.forEach(line => {
            const ld = document.createElement('div'); ld.className = "lyric-line";
            line.forEach(t => {
                const b = Logic.state.blanks.find(x => x.t === t);
                if (!b) {
                    const span = document.createElement('span'); span.innerText = t.val;
                    if(t.type==='sp') span.style.whiteSpace = 'pre';
                    ld.appendChild(span);
                } else {
                    const grp = document.createElement('div'); grp.className = "blank-group";
                    for(let i=0; i<t.val.length; i++) {
                        const c = t.val[i];
                        if (/\s/.test(c)) {
                            const sp = document.createElement('span'); sp.innerText = c;
                            sp.style.whiteSpace = 'pre'; grp.appendChild(sp);
                        } else {
                            const u = document.createElement('span'); u.className = "char-unit";
                            const isRevealed = Logic.state.revealed.includes(charOffset);
                            const userCh = curIn[curInIdx];
                            if (isRevealed) {
                                u.innerText = c; u.classList.add('fill-hint');
                            } else if (userCh) {
                                u.innerText = userCh;
                                const isCorrect = matchMask[charOffset];
                                u.classList.add(isCorrect ? 'fill-correct' : 'fill-wrong');
                            } else {
                                u.innerHTML = "&nbsp;";
                            }
                            grp.appendChild(u);
                            charOffset++; curInIdx++;
                        }
                    }
                    ld.appendChild(grp);
                }
            });
            gv.appendChild(ld);
        });
        if(clearInput) { 
            const inp = document.getElementById('player-input'); 
            inp.value = ""; App.autoResize(inp); 
        }
    }
};

const Logic = {
    state: { song:null, target:"", tokensByLine:[], blanks:[], revealed:[], targetLen:0, lastRawInput: "", selectedRanges: [] },
    saveSession: () => {
        const pa = document.getElementById('game-play-area');
        if(pa && pa.style.display !== 'none' && Logic.state.song){

    getSelectedSongs: () => {
        const allSongs = Data.getSongs();
        const sel = Logic.state.selectedRanges || [];
        if (sel.includes('__all__')) {
            return allSongs;
        }

        const allPlaylists = Data.getPlaylists();
        const isLang = (x) => x && ((x.id && x.id.startsWith('pl_lang_')) || ['中文', '英文', '日文'].includes(x.name));
        const customPls = allPlaylists.filter(x => !isLang(x));
        const inCustomPlaylistSongIds = new Set();
        customPls.forEach(p => (p.songIds || []).forEach(id => inCustomPlaylistSongIds.add(id)));

        const getOtherLangSongs = (langKey, plId, plName) => {
            const pl = allPlaylists.find(x => x.id === plId || x.name === plName);
            const plSongIds = new Set(pl && pl.songIds ? pl.songIds : []);
            return allSongs.filter(s => (s.lang === langKey || plSongIds.has(s.id)) && !inCustomPlaylistSongIds.has(s.id));
        };

        const targetSongIds = new Set();
        sel.forEach(r => {
            if (r === '__other_zh__') {
                getOtherLangSongs('zh', 'pl_lang_zh', '中文').forEach(s => targetSongIds.add(s.id));
            } else if (r === '__other_en__') {
                getOtherLangSongs('en', 'pl_lang_en', '英文').forEach(s => targetSongIds.add(s.id));
            } else if (r === '__other_ja__') {
                getOtherLangSongs('ja', 'pl_lang_ja', '日文').forEach(s => targetSongIds.add(s.id));
            } else {
                const pl = allPlaylists.find(x => x.id === r);
                if (pl && pl.songIds) {
                    pl.songIds.forEach(id => targetSongIds.add(id));
                }
            }
        });
        return allSongs.filter(s => targetSongIds.has(s.id));
    },

    startGame: () => { 
        const all = Data.getSongs();
        if(!all.length) return alert("⚠️ 目前題庫為空，請先載入題庫！");
        const sgs = Logic.getSelectedSongs();
        if(!sgs.length) return alert("所選範圍內無歌曲，請至少勾選一個有歌曲的範圍！");
        document.getElementById('game-setup').style.display='none'; 
        document.getElementById('game-play-area').style.display='block'; 
        Logic.next(); 
    },
    
    next: () => {
        let sgs = Logic.getSelectedSongs();
        if(!sgs.length) return alert("範圍內無歌曲，請重新選擇範圍！");

        const st = Data.getStats(); 
        let played = st.playedInRound || [];
        let pool = sgs.filter(s => !played.includes(s.id));
        if(!pool.length) {
            if(!confirm(`已完成一輪出題（範圍內所有歌曲皆已出過）！\n是否開啟新一輪？`)) {
                st.playedInRound = [];
                Data.saveStats(st);
                Logic.exitToSetup();
                return;
            }
            played = []; 
            pool = sgs; 
        }

        const song = pool[Math.floor(Math.random()*pool.length)]; 
        Logic.state.song = song;
        st.playedInRound = played;
        if(!st.playedInRound.includes(song.id)) st.playedInRound.push(song.id);
        
        // 整理所有有效歌詞行與其所屬段落編號
        const lineObjects = [];
        let paraIdx = 0;
        song.lyrics.forEach(l => {
            const cl = Parser.clean(l);
            if (!l.trim() || !cl) {
                paraIdx++;
            } else {
                lineObjects.push({ text: cl, paraIdx });
            }
        });

        const N = lineObjects.length;
        if (N === 0) {
            Logic.next();
            return;
        }

        // 若整首歌有效歌詞少於等於 3 行，直接全部出題
        if (N <= 3) {
            Logic.prepare(lineObjects.map(o => o.text));
            return;
        }

        const minL = 3;
        const maxL = Math.min(5, N);
        const candidates = [];

        for (let l = minL; l <= maxL; l++) {
            for (let i = 0; i <= N - l; i++) {
                const slice = lineObjects.slice(i, i + l);
                const paraSpan = slice[slice.length - 1].paraIdx - slice[0].paraIdx;
                // 允許同段落(0)或跨1個相鄰段落(1)，避免跨太多段落
                if (paraSpan <= 1) {
                    candidates.push({ start: i, len: l, lines: slice.map(s => s.text) });
                }
            }
        }

        if (candidates.length === 0) {
            Logic.prepare(lineObjects.slice(0, minL).map(o => o.text));
            return;
        }

        if (!st.usedMap[song.id] || !Array.isArray(st.usedMap[song.id])) {
            st.usedMap[song.id] = [];
        }

        const usedSet = new Set(st.usedMap[song.id]);

        // 計算各候選句段與已出過行數的重疊度
        let scored = candidates.map(c => {
            let overlap = 0;
            for (let j = c.start; j < c.start + c.len; j++) {
                if (usedSet.has(j)) overlap++;
            }
            return { ...c, overlap };
        });

        let minOverlap = Math.min(...scored.map(s => s.overlap));
        let poolCandidates = scored.filter(s => s.overlap === minOverlap);

        // 若全部候選句段都有重疊（整首歌各段皆已出過一輪），重置該歌的已出記錄
        if (minOverlap > 0) {
            usedSet.clear();
            scored = candidates.map(c => ({ ...c, overlap: 0 }));
            poolCandidates = scored;
        }

        const picked = poolCandidates[Math.floor(Math.random() * poolCandidates.length)];

        // 將選中的行記錄進 usedSet
        for (let j = picked.start; j < picked.start + picked.len; j++) {
            usedSet.add(j);
        }
        st.usedMap[song.id] = Array.from(usedSet);
        Data.saveStats(st);

        Logic.prepare(picked.lines);
    },

    prepare: (lines) => {
        const tbl = lines.map(l => Parser.tokenize(l)); const meaningful = []; let tv = 0;
        tbl.forEach((line, li) => { line.forEach((t, ti) => { const cl = t.type==='en'?t.val.length:(t.type==='cjk'?1:0); if(cl>0){ meaningful.push({t,li,ti,cl}); tv+=cl; } }); });
        
        if (tv === 0) { Logic.next(); return; }

        const sentences = []; let cs = [];
        tbl.forEach((line, li) => { line.forEach((t, ti) => { if(t.type==='en'||t.type==='cjk') cs.push({t,li,ti,cl:t.type==='en'?t.val.length:1}); else if(t.type==='sym'||t.type==='sp'){ if(cs.length) sentences.push(cs); cs=[]; } }); if(cs.length) sentences.push(cs); cs=[]; });
        
        const minB = Math.floor(tv*0.2), maxB = Math.floor(tv*0.5); 
        
        const rand = Math.random();
        const mode = (rand < 0.1) ? 1 : (Math.random() < 0.5 ? 0 : 2);

        let blanks = [];
        if(mode===1) { 
            let b=0; for(let i=0;i<sentences.length;i++){ let sl=sentences[i].reduce((a,c)=>a+c.cl,0); if(b+sl>maxB)break; blanks=blanks.concat(sentences[i]); b+=sl; } 
        } else if(mode===2) { 
            let b=0; let picked=[]; for(let i=sentences.length-1;i>=0;i--){ let sl=sentences[i].reduce((a,c)=>a+c.cl,0); if(b+sl>maxB)break; picked.unshift(sentences[i]); b+=sl; } 
            picked.forEach(s=>{ blanks=blanks.concat(s); });
        } else { 
            let si=Math.floor(sentences.length/3), b=0; for(let i=si;i<sentences.length;i++){ let sl=sentences[i].reduce((a,c)=>a+c.cl,0); if(b+sl>maxB)break; blanks=blanks.concat(sentences[i]); b+=sl; } 
        }
        
        if(blanks.reduce((a,c)=>a+c.cl,0) < minB){ 
            blanks=[]; let b=0, rs=Math.floor(Math.random()*meaningful.length); 
            for(let i=rs;i<meaningful.length;i++){ if(b+meaningful[i].cl>maxB && b>=minB)break; blanks.push(meaningful[i]); b+=meaningful[i].cl; } 
            if(b < minB) for(let i=rs-1;i>=0 && b<minB;i--){ blanks.unshift(meaningful[i]); b+=meaningful[i].cl; } 
        }
        
        if (blanks.length === 0 && meaningful.length > 0) blanks = [meaningful[0]];

        Logic.state.tokensByLine=tbl; Logic.state.blanks=blanks; 
        let targetStr = ""; tbl.forEach(line => { line.forEach(t => { if (blanks.some(b => b.t === t)) { targetStr += t.val; } }); }); 
        Logic.state.target=targetStr; Logic.state.targetLen=blanks.reduce((a,c)=>a+c.cl,0); Logic.state.revealed=[]; Logic.state.lastRawInput=""; 
        App.render(); Logic.saveSession();
    },

    submit: () => {
        const raw = document.getElementById('player-input').value; 
        if(Tolerance.normalize(raw) === Tolerance.normalize(Logic.state.target)) { 
            document.getElementById('player-input').value = "";
            const st=Data.getStats(); st.ok++; st.ch+=Logic.state.targetLen; Data.saveStats(st); Logic.updateStats(); 
            Logic.next();
        } else { Logic.state.lastRawInput=raw; App.render(false); Logic.saveSession(); }
    },

    getHint: () => {
        const target = Logic.state.target;
        const currentFilteredIn = document.getElementById('player-input').value.split('').filter(c => !/\s/.test(c));
        const lastFin = Logic.state.lastRawInput ? Logic.state.lastRawInput.split('').filter(c => !/\s/.test(c)) : [];
        const lastMask = Tolerance.getMatchMask(lastFin, target);
        const curMask = Tolerance.getMatchMask(currentFilteredIn, target);
        let pool = [];
        for(let i=0; i<target.length; i++) {
            if(!Logic.state.revealed.includes(i) && !/\s/.test(target[i])) {
                const isCorrectOnScreen = lastFin[i] && lastMask[i];
                const isCorrectInInput = currentFilteredIn[i] && curMask[i];
                if (!isCorrectOnScreen && !isCorrectInInput) {
                    pool.push(i);
                }
            }
        }
        if(!pool.length) {
            for(let i=0; i<target.length; i++) {
                if(!Logic.state.revealed.includes(i) && !/\s/.test(target[i])) {
                    pool.push(i);
                }
            }
        }
        if(pool.length) { Logic.state.revealed.push(pool[Math.floor(Math.random()*pool.length)]); App.render(false); Logic.saveSession(); }
    },

    skip: () => { const st=Data.getStats(); st.sk++; Data.saveStats(st); Logic.updateStats(); Logic.next(); },
    updateStats: () => { const s=Data.getStats(); document.getElementById('st-ok').innerText=s.ok; document.getElementById('st-ch').innerText=s.ch; document.getElementById('st-sk').innerText=s.sk; }
};

    move: (index, dir) => {
        const pls = Data.getPlaylists();

        if (targetIndex < 0 || targetIndex >= pls.length) return;
        
        const isLang = (x) => x && ((x.id && x.id.startsWith('pl_lang_')) || ['中文', '英文', '日文'].includes(x.name));
        if (isLang(pls[index]) !== isLang(pls[targetIndex])) return;
        
        const temp = pls[index];
        pls[index] = pls[targetIndex];
        pls[targetIndex] = temp;
        
        Data.savePlaylists(pls);
        Playlists.render();
        Logic.refreshPlaylistSelect();

        const pls = Data.getPlaylists();
        const p = pls.find(x => x.id === id);

        const isLang = (x) => x && ((x.id && x.id.startsWith('pl_lang_')) || ['中文', '英文', '日文'].includes(x.name));

    getFilteredMultiAddSongs: () => {
        const allSongs = Data.getSongs();
        const searchInput = document.getElementById('multi-pl-search');
        const q = (searchInput ? searchInput.value : "").trim().toLowerCase();
        const onlyIn = document.getElementById('multi-pl-only-in') ? document.getElementById('multi-pl-only-in').checked : false;

        return allSongs.filter(s => {
            if (onlyIn && !Playlists.multiAddSelected.has(s.id)) return false;
            if (q) {
                const match = s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q);
                if (!match) return false;
            }
            return true;
        });
    },
    getCurrentMultiAddPageSongs: () => {
        const filtered = Playlists.getFilteredMultiAddSongs();
        const PAGE_SIZE = 20;
        const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
        let page = Playlists.multiAddPage;
        if (page > totalPages) page = totalPages;
        if (page < 1) page = 1;
        const startIndex = (page - 1) * PAGE_SIZE;
        return filtered.slice(startIndex, startIndex + PAGE_SIZE);
    },
    onSearchInput: () => {
        Playlists.multiAddPage = 1;
        Playlists.renderMultiAddList();
    },
    onFilterChange: () => {
        Playlists.multiAddPage = 1;
        Playlists.renderMultiAddList();
    },
    goToMultiAddPage: (p) => {
        Playlists.multiAddPage = p;
        Playlists.renderMultiAddList();
    },
    onMultiAddCheck: (songId, checked) => {
        if (checked) Playlists.multiAddSelected.add(songId);
        else Playlists.multiAddSelected.delete(songId);
    },
    toggleMultiAdd: (select) => {
        const pageSongs = Playlists.getCurrentMultiAddPageSongs();
        if (select) {
            pageSongs.forEach(s => Playlists.multiAddSelected.add(s.id));
        } else {
            pageSongs.forEach(s => Playlists.multiAddSelected.delete(s.id));
        }
        Playlists.renderMultiAddList();
    },
    openMultiAdd: (playlistId) => {
        const modal = document.getElementById('multi-fav-modal');
        const pl = Data.getPlaylists().find(p => p.id === playlistId);
        document.getElementById('multi-pl-id').value = playlistId;
        document.getElementById('multi-pl-name').innerText = "目標歌單：" + pl.name;

        const sInput = document.getElementById('multi-pl-search');
        if (sInput) sInput.value = "";
        const onlyInCb = document.getElementById('multi-pl-only-in');
        if (onlyInCb) onlyInCb.checked = false;

        Playlists.multiAddId = playlistId;
        Playlists.multiAddPage = 1;
        Playlists.multiAddSelected = new Set(pl.songIds ? pl.songIds : []);

        Playlists.renderMultiAddList();
        modal.style.display = 'block';
    },
    renderMultiAddList: () => {
        const container = document.getElementById('multi-fav-list');
        if (!container) return;
        container.innerHTML = "";

        const filteredSongs = Playlists.getFilteredMultiAddSongs();
        const PAGE_SIZE = 20;
        const totalPages = Math.ceil(filteredSongs.length / PAGE_SIZE) || 1;
        if (Playlists.multiAddPage > totalPages) Playlists.multiAddPage = totalPages;
        if (Playlists.multiAddPage < 1) Playlists.multiAddPage = 1;

        const startIndex = (Playlists.multiAddPage - 1) * PAGE_SIZE;
        const pageSongs = filteredSongs.slice(startIndex, startIndex + PAGE_SIZE);

        if (filteredSongs.length === 0) {
            container.innerHTML = `<div style="padding:30px 15px;text-align:center;color:#888;font-size:0.9rem">無符合條件之歌曲</div>`;
        } else {
            pageSongs.forEach(song => {
                const isChecked = Playlists.multiAddSelected.has(song.id);
                const langLabel = song.lang ? ` <span style="font-size:0.75rem;padding:1px 5px;background:#333;border-radius:3px;color:var(--primary-color)">${songLangText(song.lang)}</span>` : '';
                const item = document.createElement('label');
                item.className = "multi-select-item";
                item.style.padding = "6px 10px";
                item.style.fontSize = "0.85rem";
                item.innerHTML = `
                    <input type="checkbox" value="${song.id}" ${isChecked ? 'checked' : ''} onchange="Playlists.onMultiAddCheck('${song.id}', this.checked)" style="width:16px;height:16px;cursor:pointer;flex-shrink:0">
                    <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                        <b>${song.title}</b>${langLabel} <span style="color:#aaa">- ${song.artist}</span>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function songLangText(lang) {
            return lang === 'zh' ? '中' : (lang === 'en' ? '英' : '日');
        }

        const buildPagHTML = () => {
            if (filteredSongs.length === 0) return '';
            let optionsHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                optionsHTML += `<option value="${i}" ${i === Playlists.multiAddPage ? 'selected' : ''}>第 ${i} 頁</option>`;
            }
            return `
                <div class="pagination-bar">
                    <button class="btn btn-aux btn-small" onclick="Playlists.goToMultiAddPage(1)" ${Playlists.multiAddPage <= 1 ? 'disabled style="opacity:0.3;cursor:default"' : ''}>首頁</button>
                    <button class="btn btn-aux btn-small" onclick="Playlists.goToMultiAddPage(${Playlists.multiAddPage - 1})" ${Playlists.multiAddPage <= 1 ? 'disabled style="opacity:0.3;cursor:default"' : ''}>上一頁</button>
                    <span>
                        <select class="page-select" onchange="Playlists.goToMultiAddPage(Number(this.value))">
                            ${optionsHTML}
                        </select> / ${totalPages} 頁 (共 ${filteredSongs.length} 首)
                    </span>
                    <button class="btn btn-aux btn-small" onclick="Playlists.goToMultiAddPage(${Playlists.multiAddPage + 1})" ${Playlists.multiAddPage >= totalPages ? 'disabled style="opacity:0.3;cursor:default"' : ''}>下一頁</button>
                    <button class="btn btn-aux btn-small" onclick="Playlists.goToMultiAddPage(${totalPages})" ${Playlists.multiAddPage >= totalPages ? 'disabled style="opacity:0.3;cursor:default"' : ''}>末頁</button>
                </div>
            `;
        };

        const pagTop = document.getElementById('multi-fav-pagination-top');
        const pagBottom = document.getElementById('multi-fav-pagination');
        const pagHTML = buildPagHTML();
        if (pagTop) pagTop.innerHTML = pagHTML;
        if (pagBottom) pagBottom.innerHTML = pagHTML;
    },
    saveMultiAdd: () => {
        const playlistId = document.getElementById('multi-pl-id').value;
        const selectedIds = Array.from(Playlists.multiAddSelected);
        const pls = Data.getPlaylists();
        const p = pls.find(x => x.id === playlistId);
        if(p) {
            const oldSongIds = p.songIds ? [...p.songIds] : [];
            p.songIds = selectedIds;
            Data.savePlaylists(pls);
            Data.syncLangPlaylistsWithSongs(playlistId, selectedIds, oldSongIds);
            Playlists.render();
            Editor.render();
            Logic.refreshPlaylistSelect();
        }
        document.getElementById('multi-fav-modal').style.display = 'none';
    },
    openFav: (songId) => {
        const m = document.getElementById('fav-modal');
        m.style.display = 'block';
        document.getElementById('fav-song-id').value = songId;
        const c = document.getElementById('fav-playlist-options');
        c.innerHTML = "";
        const pls = Data.getPlaylists();
        if(!pls.length) { c.innerText = "請先建立歌單"; return; }
        pls.forEach(p => {
            const inL = p.songIds && p.songIds.includes(songId);
            const b = document.createElement('button');
            b.className = "btn " + (inL ? "btn-aux" : "btn-main");
            b.style.width = "100%";
            b.style.marginBottom = "5px";
            b.innerText = (inL ? "從移除: " : "加入: ") + p.name;
            b.onclick = () => {
                if(!p.songIds) p.songIds = [];
                const oldSongIds = [...p.songIds];
                let newSongIds;
                if(inL) {
                    newSongIds = p.songIds.filter(id => id !== songId);
                } else {
                    newSongIds = [...p.songIds, songId];
                }
                p.songIds = newSongIds;
                Data.savePlaylists(pls);
                Data.syncLangPlaylistsWithSongs(p.id, newSongIds, oldSongIds);
                Playlists.openFav(songId);
                Logic.refreshPlaylistSelect();
                Playlists.render();
                Editor.render();
            };
            c.appendChild(b);
        });
    }
};

const Editor = {
    selectedSongIds: new Set(),
    page: 1,
    goToPage: (p) => {
        Editor.page = p;
        Editor.render();
    },
    onSearchInput: () => {
        Editor.page = 1;
        Editor.render();
    },
    searchLyricsGoogle: () => {
        const t = document.getElementById('edit-title').value.trim();
        const a = document.getElementById('edit-artist').value.trim();
        if (!t && !a) return alert("請先輸入歌名或歌手！");
        const query = `${t} ${a} 歌詞`.trim();
        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
    },
    getCurrentPageSongs: () => {
        const q = (document.getElementById('search-input') ? document.getElementById('search-input').value : "").toLowerCase();
        const adv = document.getElementById('search-advanced') ? document.getElementById('search-advanced').checked : false;
        const allSongs = Data.getSongs();
        const filtered = allSongs.filter(s => {
            if(!q) return true;
            const matchMeta = s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q);
            if(matchMeta) return true;
            if(adv && s.lyrics) return s.lyrics.some(line => line.toLowerCase().includes(q));
            return false;
        });

        const PAGE_SIZE = 20;
        const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
        let page = Editor.page;
        if (page > totalPages) page = totalPages;
        if (page < 1) page = 1;

        const startIndex = (page - 1) * PAGE_SIZE;
        return filtered.slice(startIndex, startIndex + PAGE_SIZE);
    },
    render: () => { 
        const list = document.getElementById('editor-list'); 
        list.innerHTML = ""; 
        const q = (document.getElementById('search-input') ? document.getElementById('search-input').value : "").toLowerCase();
        const adv = document.getElementById('search-advanced') ? document.getElementById('search-advanced').checked : false;

        const allSongs = Data.getSongs();
        const pagTop = document.getElementById('editor-pagination-top');
        const pagBottom = document.getElementById('editor-pagination');

        if (!allSongs.length) {
            list.innerHTML = `<div style="padding:35px 15px;text-align:center;color:#888;line-height:1.8">⚠️ 目前題庫為空<br><span style="font-size:0.85rem">可點擊上方「載入 question.json」、「匯入」或「+ 新增歌曲」開始建立題庫。</span></div>`;
            if (pagTop) pagTop.innerHTML = "";
            if (pagBottom) pagBottom.innerHTML = "";
            Editor.updateBatchBtn();
            return;
        }

        const filtered = allSongs.filter(s => {
            if(!q) return true;
            const matchMeta = s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q);
            if(matchMeta) return true;
            if(adv && s.lyrics) return s.lyrics.some(line => line.toLowerCase().includes(q));
            return false;
        });

        const PAGE_SIZE = 20;
        const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
        if (Editor.page > totalPages) Editor.page = totalPages;
        if (Editor.page < 1) Editor.page = 1;

        const startIndex = (Editor.page - 1) * PAGE_SIZE;
        const pageSongs = filtered.slice(startIndex, startIndex + PAGE_SIZE);

        pageSongs.forEach(s => { 
            const langLabel = s.lang ? ` <span style="font-size:0.75rem;padding:1px 5px;background:#333;border-radius:3px;color:var(--primary-color)">${songLangText(s.lang)}</span>` : '';
            const isChecked = Editor.selectedSongIds.has(s.id);
            const item = document.createElement('div'); 
            item.className = "list-item-compact"; 
            item.innerHTML = `
                <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;margin-right:8px">
                    <input type="checkbox" value="${s.id}" ${isChecked ? 'checked' : ''} onchange="Editor.onSongCheck('${s.id}', this.checked)" style="width:16px;height:16px;cursor:pointer;flex-shrink:0">
                    <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                        <b>${s.title}</b>${langLabel} <span style="color:#aaa;font-size:0.85rem">- ${s.artist}</span>
                    </div>
                </div>
                <div class="item-btns" style="flex-shrink:0">
                    <button class="btn btn-aux btn-small" style="padding:4px 8px;font-size:0.75rem" onclick="Playlists.openFav('${s.id}')">歌單</button>
                    <button class="btn btn-aux btn-small" style="padding:4px 8px;font-size:0.75rem" onclick="Editor.openModal('${s.id}')">編輯</button>
                    <button class="btn btn-aux btn-small" style="padding:4px 8px;font-size:0.75rem;color:red" onclick="Editor.deleteItem('${s.id}')">刪除</button>
                </div>
            `; 
            list.appendChild(item); 
        }); 

        function songLangText(lang) {
            return lang === 'zh' ? '中' : (lang === 'en' ? '英' : '日');
        }

        const buildPaginationHTML = () => {
            if (filtered.length === 0) return '';
            let optionsHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                optionsHTML += `<option value="${i}" ${i === Editor.page ? 'selected' : ''}>第 ${i} 頁</option>`;
            }
            return `
                <div class="pagination-bar">
                    <button class="btn btn-aux btn-small" onclick="Editor.goToPage(1)" ${Editor.page <= 1 ? 'disabled style="opacity:0.3;cursor:default"' : ''}>首頁</button>
                    <button class="btn btn-aux btn-small" onclick="Editor.goToPage(${Editor.page - 1})" ${Editor.page <= 1 ? 'disabled style="opacity:0.3;cursor:default"' : ''}>上一頁</button>
                    <span>
                        <select class="page-select" onchange="Editor.goToPage(Number(this.value))">
                            ${optionsHTML}
                        </select> / ${totalPages} 頁 (共 ${filtered.length} 首)
                    </span>
                    <button class="btn btn-aux btn-small" onclick="Editor.goToPage(${Editor.page + 1})" ${Editor.page >= totalPages ? 'disabled style="opacity:0.3;cursor:default"' : ''}>下一頁</button>
                    <button class="btn btn-aux btn-small" onclick="Editor.goToPage(${totalPages})" ${Editor.page >= totalPages ? 'disabled style="opacity:0.3;cursor:default"' : ''}>末頁</button>
                </div>
            `;
        };

        const pagHTML = buildPaginationHTML();
        if (pagTop) pagTop.innerHTML = pagHTML;
        if (pagBottom) pagBottom.innerHTML = pagHTML;

        Editor.updateBatchBtn();
    },
    onSongCheck: (id, checked) => {
        if (checked) Editor.selectedSongIds.add(id);
        else Editor.selectedSongIds.delete(id);
        Editor.updateBatchBtn();
    },
    updateBatchBtn: () => {
        const delBtn = document.getElementById('editor-batch-del-btn');
        const favBtn = document.getElementById('editor-batch-fav-btn');
        const count = Editor.selectedSongIds.size;
        if (delBtn) {
            delBtn.innerText = count > 0 ? `批量刪除 (${count})` : "批量刪除";
        }
        if (favBtn) {
            favBtn.innerText = count > 0 ? `批量加入歌單 (${count})` : "批量加入歌單";
        }
    },
    openBatchFav: () => {
        const ids = Array.from(Editor.selectedSongIds);
        if (!ids.length) return alert("請先勾選要加入歌單的歌曲！");
        const pls = Data.getPlaylists();
        if (!pls.length) return alert("目前尚無歌單，請先至「歌單管理」建立歌單！");
        
        document.getElementById('batch-fav-title').innerText = `批量加入歌單 (已選取 ${ids.length} 首歌)`;
        Editor.renderBatchFavOptions();
        document.getElementById('batch-fav-modal').style.display = 'block';
    },
    renderBatchFavOptions: () => {
        const container = document.getElementById('batch-fav-options');
        if (!container) return;
        container.innerHTML = "";
        const pls = Data.getPlaylists();
        const ids = Array.from(Editor.selectedSongIds);

        pls.forEach(p => {
            const inCount = ids.filter(id => p.songIds && p.songIds.includes(id)).length;
            const row = document.createElement('div');
            row.className = "list-item-compact";
            row.style.padding = "8px 12px";
            row.style.marginBottom = "8px";
            row.innerHTML = `
                <div style="flex:1;min-width:0;margin-right:8px">
                    <b>${p.name}</b>
                    <div style="font-size:0.8rem;color:#aaa">已含選取歌曲：${inCount} / ${ids.length} 首</div>
                </div>
                <div class="item-btns" style="flex-shrink:0">
                    <button class="btn btn-main btn-small" style="padding:4px 10px;font-size:0.8rem" onclick="Editor.applyBatchFav('${p.id}', true)">全部加入</button>
                    ${inCount > 0 ? `<button class="btn btn-aux btn-small" style="padding:4px 10px;font-size:0.8rem;color:var(--error-color)" onclick="Editor.applyBatchFav('${p.id}', false)">全部移除</button>` : ''}
                </div>
            `;
            container.appendChild(row);
        });
    },
    applyBatchFav: (playlistId, isAdd) => {
        const pls = Data.getPlaylists();
        const p = pls.find(x => x.id === playlistId);
        if (!p) return;
        if (!p.songIds) p.songIds = [];

        const oldSongIds = [...p.songIds];
        const ids = Array.from(Editor.selectedSongIds);

        if (isAdd) {
            let addedCount = 0;
            ids.forEach(id => {
                if (!p.songIds.includes(id)) {
                    p.songIds.push(id);
                    addedCount++;
                }
            });
            Data.savePlaylists(pls);
            Data.syncLangPlaylistsWithSongs(p.id, p.songIds, oldSongIds);
            Playlists.render();
            Logic.refreshPlaylistSelect();
            Editor.renderBatchFavOptions();
            alert(`已將選取的歌曲成功加入至「${p.name}」！`);
        } else {
            p.songIds = p.songIds.filter(id => !ids.includes(id));
            Data.savePlaylists(pls);
            Data.syncLangPlaylistsWithSongs(p.id, p.songIds, oldSongIds);
            Playlists.render();
            Logic.refreshPlaylistSelect();
            Editor.renderBatchFavOptions();
            alert(`已將選取的歌曲從「${p.name}」中移除！`);
        }
    },
    toggleSelectAll: (select) => {
        const pageSongs = Editor.getCurrentPageSongs();
        if (select) {
            pageSongs.forEach(s => Editor.selectedSongIds.add(s.id));
        } else {
            pageSongs.forEach(s => Editor.selectedSongIds.delete(s.id));
        }
        Editor.render();
    },
    deleteBatch: () => {
        const ids = Array.from(Editor.selectedSongIds);
        if(!ids.length) return alert("請先勾選要刪除的歌曲！");
        if(confirm(`確定刪除選取的 ${ids.length} 首歌？`)) {
            Data.saveSongs(Data.getSongs().filter(x => !ids.includes(x.id)));
            const pls = Data.getPlaylists();
            pls.forEach(p => { if (p.songIds) p.songIds = p.songIds.filter(sid => !ids.includes(sid)); });
            Data.savePlaylists(pls);
            Editor.selectedSongIds.clear();
            Editor.render();
            Playlists.render();
            Logic.refreshPlaylistSelect();
        }
    },
    openModal: (id=null) => { 
        document.getElementById('song-modal').style.display='block'; 
        if(id){ 
            const s=Data.getSongs().find(x => x.id === id); 
            document.getElementById('edit-id').value=s.id; 
            document.getElementById('edit-title').value=s.title; 
            document.getElementById('edit-artist').value=s.artist; 
            document.getElementById('edit-lang').value=s.lang || ""; 
            document.getElementById('edit-lyrics').value=s.lyrics.join('\n'); 
        } else { 
            document.getElementById('edit-id').value=""; 
            document.getElementById('edit-title').value=""; 
            document.getElementById('edit-artist').value=""; 
            document.getElementById('edit-lang').value=""; 
            document.getElementById('edit-lyrics').value=""; 
        } 
    },
    closeModal: () => document.getElementById('song-modal').style.display='none',
    save: () => { 
        const id=document.getElementById('edit-id').value;
        const t=document.getElementById('edit-title').value.trim();
        const a=document.getElementById('edit-artist').value.trim();
        const lang=document.getElementById('edit-lang').value;
        const rawL=document.getElementById('edit-lyrics').value;
        const l=rawL.split('\n'); 

        if(!t) return alert("歌名必填"); 
        const meaningfulLines = l.filter(line => line.trim().length > 0);
        if(meaningfulLines.length === 0) return alert("歌詞欄不能為空白！");

        let ss=Data.getSongs(); 
        const isDup = ss.some(s => s.id !== id && s.title.trim().toLowerCase() === t.toLowerCase() && s.artist.trim().toLowerCase() === a.toLowerCase());
        if(isDup){
            return alert("題庫中已存在相同歌名與歌手的歌曲，無法重複新增！");
        }

        let savedSongId = id;
        if(id){ 
            const i=ss.findIndex(x=>x.id===id); 
            ss[i]={id, title:t, artist:a, lyrics:l, lang}; 
        } else {
            savedSongId = 's' + Date.now();
            ss.push({id:savedSongId, title:t, artist:a, lyrics:l, lang}); 
        }
        Data.saveSongs(ss); 
        Data.syncSongWithLangPlaylists(savedSongId, lang);
        Editor.closeModal(); 
        Editor.render(); 
        Logic.refreshPlaylistSelect();
    },
    deleteItem: (id) => { 
        if(confirm("確定刪除這首歌？")) { 
            Data.saveSongs(Data.getSongs().filter(x => x.id !== id)); 
            const pls = Data.getPlaylists();
            pls.forEach(p => { if (p.songIds) p.songIds = p.songIds.filter(sid => sid !== id); });
            Data.savePlaylists(pls);
            Editor.selectedSongIds.delete(id);
            Editor.render(); 
            Playlists.render();
            Logic.refreshPlaylistSelect();
        } 
    }
};

window.onload = Logic.init;
</script>
